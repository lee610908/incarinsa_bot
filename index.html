<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인사업무봇</title>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
:root {
    --primary: #2563eb; --primary-soft: #eff6ff;
    --bg: #f8fafc; --surface: #fff;
    --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
}
[data-theme="dark"] {
    --bg: #0a0e27; --surface: #151d3b;
    --text: #f1f5f9; --muted: #94a3b8; --border: #2d3748; --primary-soft: #1e3a5f;
}
* { margin:0; padding:0; box-sizing:border-box; }
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

.header { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.header-left { display:flex; align-items:center; gap:10px; }
.avatar { width:36px; height:36px; background:linear-gradient(135deg,#1e3a8a,#2563eb); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; }
.header h1 { font-size:15px; font-weight:700; color:var(--text); }
.header-right { display:flex; gap:4px; }
.icon-btn { width:34px; height:34px; border-radius:8px; border:none; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.icon-btn:hover { background:var(--primary-soft); color:var(--primary); }

.content-wrap { flex:1; overflow-y:auto; padding:16px 16px 100px; }

.title-section { padding:8px 4px 16px; animation:fadeUp 0.25s ease; }
.title-main { font-size:18px; font-weight:700; color:var(--text); margin-bottom:4px; }
.title-sub { font-size:13px; color:var(--muted); }

.card-btn { width:100%; background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:10px; cursor:pointer; display:flex; align-items:center; gap:14px; text-align:left; transition:all 0.2s; font-family:inherit; animation:fadeUp 0.25s ease; }
.card-btn:hover { border-color:var(--primary); background:var(--primary-soft); transform:translateY(-1px); box-shadow:0 4px 12px rgba(37,99,235,0.1); }
.card-icon { font-size:24px; flex-shrink:0; }
.card-title { font-size:14px; font-weight:600; color:var(--text); margin-bottom:3px; }
.card-desc { font-size:12px; color:var(--muted); }

.nav-bar { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; animation:fadeUp 0.2s ease; }
.nav-btn { display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); font-size:13px; font-weight:600; color:var(--text); cursor:pointer; transition:all 0.2s; font-family:inherit; }
.nav-btn:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-soft); }

.answer-card { background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:20px; animation:fadeUp 0.25s ease; }
.answer-tag { display:inline-block; background:var(--primary-soft); color:var(--primary); font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; margin-bottom:12px; }
.answer-q { font-size:15px; font-weight:700; color:var(--text); margin-bottom:14px; line-height:1.5; }
.answer-a { font-size:13px; color:var(--muted); line-height:1.9; white-space:pre-wrap; }
.answer-actions { display:flex; gap:8px; margin-top:16px; padding-top:12px; border-top:1px dashed var(--border); }
.act-btn { display:flex; align-items:center; gap:4px; padding:6px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; transition:all 0.2s; font-family:inherit; }
.act-btn:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-soft); }
.act-btn.saved { border-color:#f59e0b; color:#f59e0b; background:#fffbeb; }

.input-area { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); padding:12px 16px; z-index:50; }
.input-row { display:flex; align-items:center; gap:8px; background:var(--bg); border:1.5px solid var(--border); border-radius:24px; padding:6px 6px 6px 16px; transition:all 0.2s; }
.input-row:focus-within { border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
.input-row input { flex:1; border:none; background:transparent; outline:none; font-size:14px; color:var(--text); font-family:inherit; }
.input-row input::placeholder { color:var(--muted); }
.send-btn { width:36px; height:36px; border-radius:50%; border:none; background:var(--primary); color:white; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.send-btn:hover { background:#1d4ed8; transform:scale(1.05); }

.bm-panel { display:none; position:fixed; top:57px; right:0; bottom:0; width:100%; max-width:360px; background:var(--surface); border-left:1px solid var(--border); box-shadow:-4px 0 20px rgba(0,0,0,0.1); z-index:40; overflow-y:auto; padding:16px; }
.bm-panel.show { display:block; animation:fadeUp 0.2s ease; }
.bm-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.bm-title { font-size:15px; font-weight:700; color:var(--text); }
.bm-card { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer; transition:all 0.2s; }
.bm-card:hover { border-color:var(--primary); }
.bm-card-q { font-size:13px; font-weight:600; color:var(--text); margin-bottom:4px; }
.bm-card-tag { font-size:11px; color:var(--primary); }
.bm-card-actions { display:flex; justify-content:flex-end; margin-top:8px; }

.backup-menu { position:fixed; bottom:80px; right:16px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.12); z-index:60; overflow:hidden; display:none; min-width:160px; }
.backup-menu.show { display:block; animation:fadeUp 0.15s ease; }
.backup-item { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; font-size:13px; color:var(--text); transition:all 0.2s; font-family:inherit; background:none; border-left:none; border-right:none; width:100%; text-align:left; }
.backup-item:last-child { border-bottom:none; }
.backup-item:hover { background:var(--primary-soft); color:var(--primary); }

.toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#1e293b; color:white; padding:8px 18px; border-radius:20px; font-size:13px; font-weight:600; z-index:999; opacity:0; transition:opacity 0.3s; pointer-events:none; white-space:nowrap; }
.toast.show { opacity:1; }

.empty { text-align:center; padding:60px 20px; color:var(--muted); }
.empty p:first-child { font-size:15px; font-weight:600; margin-bottom:6px; }
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="header">
    <div class="header-left">
        <div class="avatar"><i data-lucide="shield-check" style="width:18px;height:18px;"></i></div>
        <h1>인사업무봇</h1>
    </div>
    <div class="header-right">
        <button class="icon-btn" onclick="toggleTheme()" title="다크모드"><i data-lucide="moon" id="theme-icon" style="width:16px;height:16px;"></i></button>
        <button class="icon-btn" onclick="toggleBm()" title="즐겨찾기"><i data-lucide="star" style="width:16px;height:16px;"></i></button>
        <button class="icon-btn" onclick="toggleBackup(event)" title="백업"><i data-lucide="download" style="width:16px;height:16px;"></i></button>
    </div>
</div>

<div class="content-wrap" id="content"></div>

<div class="bm-panel" id="bm-panel">
    <div class="bm-header">
        <span class="bm-title">⭐ 즐겨찾기</span>
        <button class="icon-btn" onclick="toggleBm()"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
    </div>
    <div id="bm-list"></div>
</div>

<div class="backup-menu" id="backup-menu">
    <button class="backup-item" onclick="downloadExcel()"><i data-lucide="file" style="width:15px;height:15px;"></i> 다운로드 (Excel)</button>
    <button class="backup-item" onclick="copyAll()"><i data-lucide="copy" style="width:15px;height:15px;"></i> 클립보드 복사</button>
</div>

<div class="input-area">
    <div class="input-row">
        <input type="text" id="user-input" placeholder="직접 검색..." onkeydown="if(event.key==='Enter') doSearch()">
        <button class="send-btn" onclick="doSearch()"><i data-lucide="search" style="width:16px;height:16px;"></i></button>
    </div>
</div>

<script>

const KB = [{"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "신규등록교육과 경력자등록교육은 상호 인정이 되나요?", "a": "아니요, \"신규등록교육\"과 \"경력자등록교육\"은 상호 인정이 불가합니다.", "tag": "등록교육, 주의사항"}, {"major": "교육 및 연수", "minor": "입문 교육", "q": "입문교육 수강 신청은 누가 진행합니까?", "a": "관리자 또는 총무가 사이버입문과정을 신청하며, 신청 완료 시 FA에게 안내 문자가 발송됩니다.", "tag": "입문교육, 교육신청, 관리자업무"}, {"major": "교육 및 연수", "minor": "입문 교육", "q": "총무 업무 담당자도 입문교육을 이수해야 합니까?", "a": "네, 입문교육은 설계사뿐만 아니라 총무 업무자도 필수로 수강해야 합니다.", "tag": "총무, 입문교육, 필수이수"}, {"major": "교육 및 연수", "minor": "입문 교육", "q": "입문교육 수강 가능 기간에 대한 제한 규정이 있습니까?", "a": "입문교육은 관리자가 신청한 해당 월 내에만 수강이 가능합니다.", "tag": "입문교육, 수강기간, 교육운영"}, {"major": "교육 및 연수", "minor": "입문 교육", "q": "입문교육 수강 후 최종적으로 완료해야 하는 절차는 무엇입니까?", "a": "과정 수료 후 수신된 SMS를 확인하여 준법서약서 작성 및 본인인증(금소법 인증)을 완료해야 합니다.", "tag": "입문교육, 준법서약서, 본인인증"}, {"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "보험대리점 등록교육 중 손해보험 과목의 최소 교육 시간은?", "a": "손해보험 과목은 최소 25시간 이상 이수해야 합니다.", "tag": "대리점교육, 손해보험, 교육시간, 유자격자"}, {"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "신규 설계사 등록교육 중 공통과목의 최소 교육 시간과 내용은?", "a": "최소 10시간이며, 보험의 의의와 역할, 보험계약과 보험약관, 보험모집 관련 법규, 모집종사자 윤리, 분쟁사례, 모집실무 등을 다룹니다.", "tag": "신규교육, 공통과목, 교육시간, 교육내용"}, {"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "경력자 등록교육 시 제3보험 과목의 세부 교과목은 무엇인가요?", "a": "제3보험산업 동향, 제3보험 신상품 동향, 제3보험 기초의학용어, 제3보험 언더라이팅, 보험금 산정 및 지급절차 등이 포함됩니다.", "tag": "제3보험, 경력자교육, 교과목, 교육내용"}, {"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "보험연수원에서 조회가 되지 않는 '내부교육' 수료 여부는 어디서 확인하나요?", "a": "내부교육 이력은 '모집종사자교육협의회(www.ctis.or.kr)' 홈페이지의 [나의교육이력 조회] 메뉴에서 아이핀 인증 후 확인할 수 있습니다.", "tag": "내부교육, 모집종사자교육협의회, 교육이력조회, 보험연수원"}, {"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "보험대리점(유자격자) 신규 등록교육의 종별 최소 교육 시간은 설계사와 어떻게 다른가요?", "a": "대리점 교육은 공통과목 15시간을 기본으로 생명보험 20시간(총 35H), 손해보험 25시간(총 40H), 제3보험 10시간(총 25H)으로 설계사보다 교육 시간이 더 깁니다.", "tag": "대리점교육, 유자격자교육, 교육시간, 신규등록"}, {"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "신규 설계사가 생명, 손해, 제3보험 등록교육을 병합하여 실시할 때의 총 교육 시간은?", "a": "공통과목 10시간에 손해(10H), 생명(10H), 제3보험(10H)을 합산하여 총 40시간을 이수하면 됩니다. 병합 실시 시에만 공통과목 중복이 인정됩니다.", "tag": "병합교육, 신규교육시간, 중복인정, 교육과정"}, {"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "신규 설계사 등록교육을 종별로 따로 이수할 경우 공통과목 인정 기준은?", "a": "종별(생/손/제3)로 따로 이수할 경우 공통과목(10H) 중복이 인정되지 않아 매번 다시 이수해야 합니다. 예를 들어 생명(20H)과 제3보험(20H)을 따로 이수하면 총 40시간이 소요됩니다.", "tag": "신규등록교육, 공통과목, 중복불인정, 개별이수"}, {"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "보수교육 이수 시 6개월 이내와 초과 시의 교육 시간 차이는 무엇인가요?", "a": "손해+제3보험 수료 후 6개월 이내에 생명보험 교육을 이수하면 생명보험 과목 5시간만 추가하면 되나(총 30H), 6개월을 초과할 경우 공통과목을 다시 이수해야 하므로 생명보험 교육 20시간을 별도로 이수해야 합니다(총 45H).", "tag": "교육간격, 공통과목재이수, 보수교육, 이수기준"}, {"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "손해, 생명, 제3보험 경력자가 보수교육을 병합하여 실시할 경우 총 교육 시간은?", "a": "공통과목 15시간에 손해(5H), 생명(5H), 제3보험(5H)을 각각 더하여 총 30시간을 이수하면 됩니다. 공통과목은 중복 인정됩니다.", "tag": "병합교육, 보수교육시간, 중복인정, 경력자교육"}, {"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "보험설계사 보수교육의 종별 최소 교육 시간은 어떻게 구성되나요?", "a": "생명보험, 손해보험, 제3보험 설계사 모두 공통과목(15시간)과 해당 종별 과목(5시간)을 합산하여 총 20시간 이상의 교육을 이수해야 합니다.", "tag": "보수교육, 교육시간, 공통과목, 종별과목"}, {"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "신규 등록교육과 경력자 등록교육 간의 상호 인정이 가능한가요?", "a": "아니요, 신규 등록교육과 경력자 등록교육은 상호 인정되지 않습니다. 대상자의 자격 구분(신인 또는 경력)에 맞는 교육 과정을 반드시 개별적으로 이수해야 합니다.", "tag": "등록교육, 교육상호인정, 교육이수기준"}, {"major": "교육 및 연수", "minor": "등록 및 보수 교육", "q": "복수 종목(생·손·제3보험) 등록 교육 이수 시 교육 시간 중복 인정 및 합산 기준은 어떻게 됩니까?", "a": "신규 등록 시 종목별로 따로 이수하면 공통과목이 중복 인정되지 않으나, 병합 실시 시 공통과목(10H)이 중복 인정되어 생+손+제3보험 합계 40H로 단축됩니다. 경력자 보수교육의 경우 공통과목(15H)이 중복 인정되며, 교육 수료일 간 간격이 6개월 이내인 경우에만 중복 인정을 적용받을 수 있습니다. 6개월을 초과하여 별도 이수할 경우 공통과목을 다시 이수해야 하므로 총 교육 시간이 증가합니다.", "tag": "교육시간, 중복인정, 병합교육, 보수교육기준"}, {"major": "시스템 및 전산", "minor": "IIMS 및 전산 활용", "q": "위촉계약서 작성 시 IIMS 내에서 팝업이 뜨지 않을 경우 어떻게 합니까?", "a": "로그인 후 위촉계약서 작성 팝업이 확인되지 않으면 관리자에게 정보 입력 여부를 확인해야 합니다.", "tag": "위촉계약서, IIMS, 시스템문의"}, {"major": "시스템 및 전산", "minor": "IIMS 및 전산 활용", "q": "IIMS에서 개인정보활용동의서를 업로드하는 상세 경로는 무엇입니까?", "a": "IIMS > 인사관리 > 영업가족직원관리 > 개인정보활용동의서 파일 업로드 메뉴를 이용합니다.", "tag": "개인정보활용동의서, IIMS, 파일업로드"}, {"major": "시스템 및 전산", "minor": "IIMS 및 전산 활용", "q": "사이버캠퍼스 로그인 시 비밀번호를 분실한 경우 초기 비밀번호는 무엇입니까?", "a": "최초 비밀번호는 본인의 사원번호와 동일하게 설정되어 있습니다.", "tag": "사이버캠퍼스, 비밀번호, 계정정보"}, {"major": "시스템 및 전산", "minor": "프로그램 설치", "q": "IIMS 설치를 위한 다이렉트 URL은 무엇입니까?", "a": "http://air.incar.co.kr/Main 입니다.", "tag": "IIMS, 설치경로, URL"}, {"major": "시스템 및 전산", "minor": "IIMS 및 전산 활용", "q": "협회 등록 및 위촉 일정을 확인하는 IIMS 내 경로는 무엇입니까?", "a": "IIMS > 인사관리 > 보험설계사등록일정 메뉴에서 확인할 수 있습니다.", "tag": "등록일정, 위촉일정, IIMS"}, {"major": "시스템 및 전산", "minor": "IIMS 및 전산 활용", "q": "생명보험협회 시험 및 자격증 발급 사이트 주소는 무엇입니까?", "a": "exam.insure.or.kr 입니다.", "tag": "생명보험협회, 합격증, 자격증"}, {"major": "시스템 및 전산", "minor": "IIMS 및 전산 활용", "q": "손해보험협회 시험 합격증 발급 사이트 주소는 무엇입니까?", "a": "isi.knia.or.kr 입니다.", "tag": "손해보험협회, 합격증, 시험정보"}, {"major": "시스템 및 전산", "minor": "IIMS 및 전산 활용", "q": "보험연수원 교육 수료증 발급을 위한 웹사이트 주소는 무엇입니까?", "a": "www.in.or.kr 입니다.", "tag": "보험연수원, 수료증, 교육기관"}, {"major": "시스템 및 전산", "minor": "IIMS 및 전산 활용", "q": "IIMS에서 협회 등록을 신청하는 세부 경로는 어떻게 됩니까?", "a": "IIMS > 인사관리 > 보험설계사협회등록/위촉 > 개별등록 메뉴에서 FA 정보를 입력하고 저장합니다.", "tag": "IIMS, 협회등록, 전산신청"}, {"major": "시스템 및 전산", "minor": "IIMS 및 전산 활용", "q": "작성된 E-클린 활용동의서의 전산 업로드 경로는 무엇입니까?", "a": "IIMS > 인사관리 > 위촉계약서 > 구비서류함의 'E-클린활용동의서 파일목록'에 업로드합니다.", "tag": "E-클린활용동의서, IIMS, 전산업로드"}, {"major": "시스템 및 전산", "minor": "프로그램 설치", "q": "인카 입문교육 수강을 위한 사이버캠퍼스 접속 주소는 무엇입니까?", "a": "PC 접속 시 'incar.fnkorea.com', 모바일 접속 시 'm-incar.fnkorea.com'으로 접속합니다.", "tag": "입문교육, 사이버캠퍼스, 교육수강"}, {"major": "시스템 및 전산", "minor": "IIMS 및 전산 활용", "q": "IIMS 로그인을 위한 초기 아이디와 비밀번호 설정 규칙은 무엇입니까?", "a": "사원번호 생성 후 로그인이 가능하며, 초기 설정은 관리자 안내에 따릅니다. (사이버캠퍼스의 경우 ID: incar+사번 / PW: 사번으로 운영됨)", "tag": "IIMS, 로그인, 계정관리"}, {"major": "시스템 및 전산", "minor": "프로그램 설치", "q": "모바일 영업 지원 앱인 IMO(인카모바일오피스+)의 설치 방법은 무엇입니까?", "a": "안드로이드(플레이스토어) 또는 iOS(앱스토어)에서 '인카모바일오피스'를 검색하여 '인카모바일오피스+' 앱을 다운로드 및 설치합니다.", "tag": "IMO, 모바일앱, 시스템설치"}, {"major": "시스템 및 전산", "minor": "프로그램 설치", "q": "인카금융서비스의 영업관리시스템인 IIMS PLUS의 설치 방법은 어떻게 되나요?", "a": "인터넷 주소창에 'http://air.incar.co.kr'을 입력하여 접속한 후, 'IIMS PLUS 인카 보험영업관리시스템 설치하기'를 클릭하여 바탕화면에 아이콘을 생성합니다.", "tag": "IIMS, 시스템설치, 영업관리"}, {"major": "시스템 및 전산", "minor": "IIMS 및 전산 활용", "q": "IIMS 시스템을 통한 협회 등록 서류 출력 시 주의사항은 무엇인가요?", "a": "설계사/유자격자 및 손보/생보/변액 구분을 정확히 선택해야 합니다. 특히 유자격자는 '유자격자고지사항'을 반드시 선택하여 출력해야 하며, 자필 서명과 개인정보 기입 누락이 없어야 합니다.", "tag": "IIMS, 서류출력, 유자격자고지사항, 자필서명"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "신인 설계사의 등록 자격 및 교육 유효기간은 어떻게 되나요?", "a": "설계사 시험합격 및 (신인)등록교육 이수 두 가지 요건을 충족한 날로부터 1년 이내입니다. (필수서류: 합격증, 등록교육 수료증)", "tag": "등록자격, 신인설계사, 교육유효기간"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "신인 유자격자의 등록 자격 및 교육 유효기간은 어떻게 되나요?", "a": "대리점 시험합격 및 (신인)등록교육 이수 두 가지 요건을 충족한 날로부터 1년 이내입니다. 보험연수원 수강신청 시 반드시 대리점(유자격자) 과정 이수가 필수입니다.", "tag": "등록자격, 신인유자격자, 교육유효기간"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "경력이 1년 미만인 경력신인의 위촉 조건은 무엇인가요?", "a": "보험 경력이 있으나 1년 미만인 경우, 신인(설계사, 유자격자)과 동일한 조건으로 위촉이 진행됩니다.", "tag": "등록자격, 경력신인"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "경력 설계사의 등록 요건은 무엇인가요?", "a": "등록예정일 기준 최근 3년 이내 설계사 경력 1년(365일) 이상이어야 하며, 경력자(보수)교육 이수 후 1년 이내여야 합니다.", "tag": "등록자격, 경력설계사"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "경력 유자격자의 등록 요건은 무엇인가요?", "a": "등록예정일 기준 최근 4년 이내 경력 2년(730일) 이상이어야 하며, 경력자 교육 이수 후 1년 이내여야 합니다.", "tag": "등록자격, 경력유자격자"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "위촉이 불가한 영업 위반 관련 기준은 무엇인가요?", "a": "1. 고의/과실로 보험사 부실모집 사실이 등재된 자", "tag": "위촉제한, 심사불가, 부실모집, 법규위반, 불완전판매"}, {"major": "위촉 및 등록", "minor": "특수 대상 등록", "q": "미성년자 위촉 시 필수 서류는 무엇인가요?", "a": "[미혼자] 법정대리인 등록동의서, 인감증명서(동의서 도장과 일치 필수), 주민등록등본 또는 가족관계증명서", "tag": "필수서류, 미성년자"}, {"major": "위촉 및 등록", "minor": "특수 대상 등록", "q": "외국인 위촉 시 비자별 필수 서류는 무엇인가요?", "a": "[F-2, F-5, F-6] 외국인등록사실증명서(3개월 내) + 외국인등록증 사본", "tag": "필수서류, 외국인, 비자"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "**경력자(보험사/유관기관)**의 경력증명서 제출 기준과 주의사항은 무엇인가요?", "a": "1. 경력증명서 원본(주민등록번호 뒷자리 기재 필수, 용도: '협회제출용' 또는 '협회 등록용')", "tag": "필수서류, 경력증명서, 내근경력"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "최근 2년 및 3년 내 경력자가 추가로 제출해야 할 증빙 서류는 무엇인가요?", "a": "직전 2년 내 경력자는 '금융사고 유무가 포함된 직전 소속회사의 경력증명서', 직전 3년 내 경력자는 'e클린보험서비스 조회결과지'를 첨부해야 합니다.", "tag": "필수증빙, 최근경력자, e클린"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "금소법 인증문자는 언제 발송됩니까?", "a": "사이버캠퍼스에서 입문과정 수료 후 준법서약 및 본인인증 단계에서 발송됩니다.", "tag": "금소법, 인증문자, 입문교육"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "위촉 서류 발송 전 반드시 완료되어야 하는 선행 조건은 무엇입니까?", "a": "서울보증보험 홈페이지를 통한 개인정보동의가 완료되어 결과가 확인되어야 합니다.", "tag": "서류제출, 보증보험, 선행조건"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "보험대리점 시험 합격자가 유자격자로 등록할 때 필요한 교육은 무엇입니까?", "a": "(신규) 생명보험/손해보험 + 제3보험 등록교육(대리점용) 수료증이 필요합니다.", "tag": "보험대리점, 유자격자, 등록교육"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "보험사 위촉 서류 중 '원본' 제출이 필수인 항목은 무엇입니까?", "a": "손보위촉서류, 생보위촉서류, 변액서류 원본은 자격 보유 시 반드시 제출해야 합니다.", "tag": "원본제출, 위촉서류, 필수서류"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "말소 여부 확인은 입사 시 필수 사항입니까?", "a": "네, 이전 직장의 말소 여부를 반드시 체크해야 합니다.", "tag": "말소여부, 위촉체크리스트, 인사관리"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "본인에게 부여된 보험설계사 코드를 확인하는 방법은 무엇입니까?", "a": "IIMS 상단의 '내설계사'를 클릭하거나, '인사관리 > 보험설계사관리(신)' 메뉴에서 확인할 수 있습니다.", "tag": "설계사코드, 코드확인, IIMS"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "생명보험사 코드 위촉 절차의 특징은 무엇입니까?", "a": "협회 등록 후 각 보험사별 일정에 맞춰 코드가 부여되며, 보험사별 위촉신청서를 작성하여 지원센터에 제출해야 합니다.", "tag": "생명보험, 코드위촉, 위촉신청서"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "손해보험사 중 자동 위촉되지 않고 개별 위촉이 필요한 회사는 어디입니까?", "a": "DB손해보험, 현대해상, 삼성화재는 별도의 개별 위촉 절차가 필요합니다.", "tag": "손해보험, 개별위촉, 보험사코드"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "손해보험사 코드 위촉은 협회 등록 후 언제 완료됩니까?", "a": "협회 등록 익일에 대부분의 보험사 코드가 자동 위촉됩니다.", "tag": "손해보험, 코드위촉, 자동위촉"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "손해보험 설계사 신규 등록 시 제출 서류는 무엇입니까?", "a": "보험설계사 시험 합격증과 (신규) 손해보험+제3보험 등록교육(설계사) 수료증을 제출해야 합니다.", "tag": "손해보험, 신규등록, 합격증"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "생명보험 유자격자 등록 시 제출해야 하는 교육 수료증의 종류는 무엇입니까?", "a": "(경력자등록) 생명보험+제3보험 교육(보험대리점 소속 설계사/유자격자용) 수료증이 필요합니다.", "tag": "생명보험, 유자격자, 교육수료증"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "신규 설계사가 협회 등록을 위해 충족해야 하는 요건은 무엇입니까?", "a": "해당 보험 시험(생보/손보/제3보험) 합격 및 관련 등록 교육 수료가 필수입니다.", "tag": "신규설계사, 시험합격, 등록교육"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "경력 설계사가 협회 등록 시 면제받는 사항은 무엇입니까?", "a": "별도의 보험설계사 시험 없이 등록 교육 수료만으로 등록이 가능합니다.", "tag": "경력자, 시험면제, 등록교육"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "협회 등록 시 '유자격자'로 인정받기 위한 기준은 무엇입니까?", "a": "최근 4년 이내에 2년 이상의 경력이 있는 자를 의미합니다.", "tag": "유자격자, 경력기준, 협회등록"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "협회 등록 시 '경력자'로 인정받기 위한 설계사의 기준은 무엇입니까?", "a": "최근 3년 이내에 1년 이상의 보험설계사 경력이 있는 자를 의미합니다.", "tag": "경력자기준, 설계사경력, 협회등록"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "보험설계사 등록을 위한 법적 근거 규정은 무엇입니까?", "a": "금융소비자 보호에 관한 법률 제16조 및 보험업법 제83조, 제84조에 근거합니다.", "tag": "보험업법, 금소법, 등록근거"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "E-클린 활용동의서의 출력 및 작성 경로는 어떻게 됩니까?", "a": "관리자가 IIMS(인사관리 > 보험설계사협회등록/위촉 > 위촉서류)에서 출력하며, FA가 직접 작성하여 제출합니다.", "tag": "E-클린활용동의서, IIMS, 서류작성"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "보증보험 동의 결과는 어디에서 확인할 수 있습니까?", "a": "IIMS 내 보증보험 등급현황 메뉴에서 동의 내역 및 결과를 확인할 수 있습니다.", "tag": "보증보험, IIMS, 결과확인"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "보증보험 동의 시 입력해야 하는 회사명과 식별 정보는 무엇입니까?", "a": "회사명은 '인카금융서비스(주)'이며, 본인의 인카 사원번호(7자리)를 함께 입력해야 합니다.", "tag": "보증보험, 사원번호, 정보입력"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "보증보험 동의 절차는 어디에서 진행합니까?", "a": "서울보증보험 홈페이지(www.sgic.co.kr)에 접속하여 '맞춤동의 > 보험수당 > 동의하기' 메뉴에서 진행합니다.", "tag": "보증보험, 서울보증보험, 개인정보동의"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "변액보험 판매 자격 보유자가 제출해야 하는 서류는 무엇입니까?", "a": "생명보험협회에서 발급한 변액보험 합격증 또는 변액합격확인서(사본)를 제출해야 합니다.", "tag": "변액보험, 자격증, 생명보험협회"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "E-클린서비스 조회내역지의 유효 기간은 어떻게 됩니까?", "a": "제출일 기준 최근 1개월 이내에 발급된 서류만 유효합니다.", "tag": "E-클린서비스, 유효기간, 서류제출"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "경력증명서 발급 시 반드시 포함되어야 하는 필수 기재 사항은 무엇입니까?", "a": "해당 경력 기간 동안의 '금융사고 여부'가 반드시 포함되어 있어야 합니다.", "tag": "경력증명서, 금융사고, 필수기재사항"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "경력 설계사 위촉 시 추가로 제출해야 하는 서류는 무엇입니까?", "a": "공통 서류 외에 직전 근무지의 경력증명서(금융사고 여부 포함)와 발급 1개월 이내의 E-클린서비스 조회내역지 출력본을 제출해야 합니다.", "tag": "경력설계사, 경력증명서, E-클린서비스"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "신규(무경력) 설계사가 입사 시 준비해야 할 공통 구비서류는 무엇입니까?", "a": "신분증 사본, 통장 사본, 반명함 사진, 손보/생보 시험합격증(1년 이내), 손보/생보 교육수료증(1년 이내)이 필요합니다.", "tag": "구비서류, 신규설계사, 입사준비"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "위촉계약서 제출 시 본인인증이 불가능한 경우의 처리 방법은 무엇입니까?", "a": "전자 서명이 불가능할 경우 서면 위촉계약서를 작성하여 관리자 또는 총무를 통해 본사 인사 담당자에게 원본을 제출해야 합니다.", "tag": "위촉계약서, 본인인증, 서면계약"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "신규 설계사의 사원번호 생성 절차는 어떻게 진행됩니까?", "a": "FA가 개인정보활용동의서를 작성하여 제출하면, 관리자 또는 총무가 IIMS(인사관리 > 직원관리 > 신규등록)에 인적사항을 입력하고 동의서 파일을 업로드하여 사원번호를 생성합니다.", "tag": "사원번호, 신규등록, 개인정보활용동의"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "영업지원부 서류 접수 시 보완 사항이 발생하면 등록 일정은 어떻게 변동되나요?", "a": "서류 보완이 발생할 경우, 보완이 완료된 날짜를 기준으로 접수일이 재산정되어 등록 일정이 지연될 수 있습니다.", "tag": "서류보완, 등록일정, 영업지원, 일정지연"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "e클린보험서비스 조회 결과가 필요한 대상은 누구인가요?", "a": "직전 3년 이내에 협회 경력이 있는 모든 등록 예정자는 e클린보험서비스 조회 결과를 첨부해야 합니다.", "tag": "e클린보험서비스, 경력조회, 필수서류, 3년이내경력"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "협회 지점 코드는 언제 입력하며, 추가 위촉 시에도 입력해야 하나요?", "a": "손보/생보 각각 최초 협회 등록 시에만 입력합니다. 이후 추가 위촉 시에는 서류 출력용으로만 활용하며 별도의 지점 코드 입력은 필요하지 않습니다.", "tag": "협회지점코드, 최초등록, 추가위촉, IIMS입력"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "협회 등록 서류 접수 후 진행 상태(피드백)는 어디서 확인하나요?", "a": "IIMS 내 '보험설계사 협회등록' 화면에서 확인할 수 있습니다. 진행 상태는 신청, 서류접수, 등록완료, 보완요청, 반송, 등록불가 등으로 구분되어 표시됩니다.", "tag": "IIMS, 진행상태, 서류접수, 피드백확인"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "협회 등록 시 발생하는 등록비용의 처리 방식은 어떻게 되나요?", "a": "등록 익월에 등록비 6,000원이 발생하며, 이는 본인 부담으로 수수료에서 공제됩니다.", "tag": "등록비, 수수료공제, 본인부담, 행정비용"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "손해보험 설계사의 협회 등록 및 코드 부여 일정은 어떻게 되나요?", "a": "롯데손보 기준, 매주 화요일/금요일 마감 후 각각 목요일/익주 화요일에 등록됩니다. 협회 등록일 이후 2~3일 이내에 순차적으로 코드가 부여됩니다.", "tag": "손보등록, 코드부여, 등록일정, 영업지원"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "생명보험 설계사의 협회 등록 후 타 생보사 위촉이 가능한 시점은 언제인가요?", "a": "협회 등록 당일에는 위촉이 불가합니다. 예를 들어 15일에 협회 등록이 진행되었다면, 타 생보사 위촉은 통상적으로 그 이후(예: 28일 등 일정에 따라) 가능합니다.", "tag": "생보위촉, 위촉일정, 등록당일위촉불가, 일정관리"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "협회 '등록'과 보험사 '위촉'의 선후 관계 및 차이점은 무엇인가요?", "a": "협회 등록이 반드시 선행되어야 보험사 위촉이 가능합니다. 협회 등록은 설계사 자격을 협회에 신고하는 절차이며, 이후 각 보험사별로 위촉 서류를 접수하여 개별 코드를 부여받는 것이 위촉입니다.", "tag": "협회등록, 보험사위촉, 코드부여, 등록절차"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "시험 합격 및 교육 이수 후 등록 유효기간을 계산하는 기준은 무엇인가요?", "a": "시험 합격일 기준 전후 1년 이내에 교육을 수료해야 하며, 시험 합격일과 교육 수료일 중 더 최근 날짜로부터 1년간 등록 유효기간이 발생합니다. 시험 합격 후 1년이 경과하여 교육을 수료하면 등록이 불가하며 재응시해야 합니다.", "tag": "등록유효기간, 시험합격, 교육수료, 재응시"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "손해보험협회 및 생명보험협회의 경력 조회 시 공통 확인 사항은 무엇인가요?", "a": "각 협회 홈페이지의 모집종사자 코너를 통해 전체 경력 및 최근 3~4년 이내 경력 일수를 확인해야 합니다. 특히 당사 협회등록을 위해서는 손보와 생보 협회 양쪽 모두에서 말소 처리가 완료되어야 합니다.", "tag": "경력조회, 협회말소, 손해보험협회, 생명보험협회"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "대리점 경력자 중 경력 인정이 불가능한 경우는 어떤 경우인가요?", "a": "모집업무(유자격자, 사용인)에 실제로 종사하지 않고 단순 대표나 임원으로만 재직한 경력은 인정되지 않습니다. 개인대리점의 경우 경력 기간은 계약체결일부터 계약해지일까지로 산정합니다.", "tag": "대리점경력, 경력산정, 모집업무, 경력불인정"}, {"major": "위촉 및 등록", "minor": "구비 서류 및 동의", "q": "보험회사 내근 경력자의 경력 인정 범위와 제출 서류상 주의사항은 무엇인가요?", "a": "경력증명서 원본(주민등록번호 뒷자리 포함)을 제출해야 하며, 용도는 '협회제출용' 또는 '협회등록용'으로 기재되어야 합니다. 단, 운전기사, 교환원, 경비 등 보험업무와 직접 관련이 없는 경력은 제외됩니다.", "tag": "내근경력, 경력증명서, 업무관련성, 서류작성"}, {"major": "위촉 및 등록", "minor": "특수 대상 등록", "q": "재외동포(F-4 비자)의 협회등록을 위해 필요한 증빙 서류는 무엇인가요?", "a": "국내 거소신고사실 증명서(발급일로부터 3개월 이내)와 국내거소신고증 앞/뒷면 사본을 제출해야 합니다.", "tag": "재외동포, F-4비자, 국내거소신고, 증빙서류"}, {"major": "위촉 및 등록", "minor": "특수 대상 등록", "q": "외국인(F-2, F-5, F-6 비자)의 협회등록 시 필수 서류 및 유효기간은 어떻게 되나요?", "a": "외국인등록사실증명서(발급일로부터 3개월 이내)와 외국인등록증 앞/뒷면 사본을 제출해야 합니다. 대상 비자는 F-2(거주), F-5(영주), F-6(결혼이민)에 한합니다.", "tag": "외국인등록, 비자타입, 외국인등록사실증명, 서류유효기간"}, {"major": "위촉 및 등록", "minor": "특수 대상 등록", "q": "미성년자(미혼/기혼)의 협회등록 시 추가로 제출해야 하는 서류는 무엇인가요?", "a": "미혼 미성년자는 법정대리인의 등록동의서, 법정대리인 인감증명서(동의서 도장 일치 필수), 주민등록등본 또는 가족관계증명서를 제출해야 합니다. 기혼 미성년자는 가족관계증명서 또는 주민등록등본만 제출하면 됩니다.", "tag": "미성년자등록, 법정대리인, 인감증명서, 가족관계증명서"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "법인대리점 지점 설치 시 유자격자 등록과 관련한 필수 규정은 무엇인가요?", "a": "법인대리점 지점 설치 시, 영업하고자 하는 보험 종목(손보, 생보, 제3보험)별로 유자격자 1인 이상이 상시 등록되어 있어야 합니다. 이에 따라 각 지점의 지점장 및 대표는 반드시 유자격 등록을 진행해야 합니다.", "tag": "법인대리점, 지점설치, 유자격자필수, 지점장등록"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "유자격자(대리점) 경력 등록을 위한 세부 경력 및 교육 기준은 어떻게 되나요?", "a": "등록예정일 기준 최근 4년 이내에 설계사 또는 대리점(유자격자) 경력이 2년(730일) 이상이어야 합니다. 또한 경력자 등록교육(또는 보수교육) 이수 후 1년 이내에 등록 신청을 완료해야 합니다.", "tag": "유자격자경력, 경력산정, 대리점등록, 보수교육"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "유자격자(대리점) 신인 등록을 위한 자격 및 필수 교육 과정은 무엇인가요?", "a": "대리점 시험 합격 및 신인 등록교육 이수 요건을 충족한 날로부터 1년 이내여야 합니다. 보험연수원 수강 신청 시 반드시 '대리점(유자격자) 과정'을 선택하여 이수해야 하며, 합격증과 해당 수료증을 제출해야 합니다.", "tag": "유자격자, 대리점시험, 신인등록, 교육과정"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "경력 보험설계사의 협회등록을 위한 경력 인정 기준 및 교육 조건은 무엇인가요?", "a": "등록예정일 기준 최근 3년 이내에 설계사(사용인) 경력이 1년(365일) 이상이어야 하며, 경력자 등록교육을 이수해야 합니다. 요건 충족일로부터 1년 이내에 등록해야 하며, 경력자 등록교육 대신 보수교육을 이수한 경우에도 등록이 가능합니다.", "tag": "경력설계사, 경력인정기준, 보수교육, 등록조건"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "신인 보험설계사의 협회등록을 위한 자격 요건 및 유효 기간은 어떻게 되나요?", "a": "신인 설계사는 보험설계사 시험 합격 및 신인 등록교육 이수라는 두 가지 요건을 모두 충족해야 합니다. 해당 요건을 충족한 날로부터 1년 이내에 등록 신청을 완료해야 하며, 필수 서류로 합격증 및 신인 등록교육 수료증을 제출해야 합니다.", "tag": "신인설계사, 등록자격, 교육이수, 유효기간"}, {"major": "위촉 및 등록", "minor": "협회 및 위촉 프로세스", "q": "협회 등록과 보험사 위촉의 선후 관계 및 등록 비용 정산 방식은 어떻게 됩니까?", "a": "반드시 손·생보 협회 등록이 선행되어야만 각 보험사별 코드 위촉이 가능하며, 협회 등록 이전에는 보험사 위촉이 절대 불가합니다. 생보의 경우 협회 등록 당일에는 위촉이 불가하며 익일 이후부터 가능합니다. 협회 등록에 따른 등록비(6,000원)는 등록 익월에 본인 부담으로 수수료에서 공제 처리됩니다.", "tag": "협회등록, 보험사위촉, 등록비용, 위촉일정"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "보험회사 내근 경력자 및 대리점 경력자의 경력 인정 범위와 증빙 시 주의사항은 무엇입니까?", "a": "내근 경력자는 경력증명서 원본(주민등록번호 뒷자리 포함)을 제출해야 하며, 운전기사, 교환원, 경비 등 보험업무와 직접 관련이 없는 직종은 경력에서 제외됩니다. 대리점 경력자의 경우 모집업무(유자격자, 사용인)에 종사하지 않은 단순 임원이나 대표는 경력이 인정되지 않으며, 개인대리점 경력은 계약체결일부터 계약해지일까지의 기간으로 산정합니다.", "tag": "내근경력, 경력증명서, 모집업무, 경력인정범위"}, {"major": "위촉 및 등록", "minor": "특수 대상 등록", "q": "외국인 및 미성년자 등록 시 신분 확인을 위해 제출해야 하는 특수 서류와 유효기간은 어떻게 됩니까?", "a": "외국인의 경우 F-2, F-5, F-6 비자 소지자는 외국인등록사실증명서와 외국인등록증 사본을, F-4 비자 소지자는 국내거소신고사실증명서와 거소신고증 사본을 제출해야 하며 서류 유효기간은 3개월입니다. 미성년자는 법정대리인의 등록동의서, 인감증명서(도장 일치 필수), 가족관계증명서를 제출해야 하며 기혼 미성년자는 가족관계증명서 또는 등본만으로 갈음 가능합니다.", "tag": "외국인등록, 미성년자등록, 필수서류, 비자유형"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "보험설계사 시험 합격 및 교육 이수 결과의 유효기간 산정 방식과 실효 기준은 무엇입니까?", "a": "시험 합격일과 교육 수료일 중 더 최근 날짜로부터 1년간 유효합니다. 단, 시험 합격일 전후 1년 이내에 반드시 교육을 수료해야 합니다. 예를 들어 시험 합격 후 1년이 경과한 시점에 교육을 수료한 경우, 해당 시험 결과는 효력을 상실하여 시험에 재응시해야 합니다.", "tag": "유효기간, 시험합격, 교육수료, 등록실효"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "유자격자(대리점) 등록을 위한 경력 산정 기준 및 지점 설치 시 필수 상주 인력 규정은 어떻게 됩니까?", "a": "유자격 경력자는 등록예정일 기준 최근 4년 이내에 설계사 또는 대리점 경력이 2년(730일) 이상이어야 하며, 교육 이수 후 1년 이내에 등록해야 합니다. 법인대리점의 지점 설치 시에는 영업하고자 하는 보험종목(생보, 손보, 제3보험)별로 유자격자 1인 이상이 상시 등록되어 있어야 하므로, 각 지점의 지점장 및 대표는 반드시 유자격 등록을 완료해야 합니다.", "tag": "유자격자, 대리점등록, 지점설치기준, 경력산정"}, {"major": "위촉 및 등록", "minor": "등록 자격", "q": "신인 및 경력 설계사의 협회등록을 위한 세부 자격 요건과 필수 교육 기준은 무엇입니까?", "a": "신인 설계사는 시험 합격 및 신인 등록교육 이수를 모두 충족한 날로부터 1년 이내에 등록해야 하며, 합격증과 수료증을 제출해야 합니다. 경력 설계사는 등록예정일 기준 최근 3년 이내에 1년(365일) 이상의 설계사 경력이 있어야 하며, 경력자 등록교육 또는 보수교육을 이수한 날로부터 1년 이내에 신청 가능합니다. 단, 신규등록교육과 경력자등록교육은 상호 인정되지 않으므로 주의가 필요합니다.", "tag": "설계사자격, 경력요건, 등록교육, 보수교육"}, {"major": "위촉 심사 및 제한", "minor": "위촉 결격 사유", "q": "위촉이 아예 불가한(심사 불가) 파산 및 금융사고 관련 기준은 무엇인가요?", "a": "1. 복권되지 않은 파산자", "tag": "위촉제한, 심사불가, 파산, 금융사고, 수당환수"}, {"major": "위촉 심사 및 제한", "minor": "심사 대상 및 기준", "q": "증빙 서류 제출 후 심사를 통해 위촉 여부를 판단하는 채무/회생 심사 기준은 무엇인가요?", "a": "금융/사고 규제 및 회생/회복의 경우 '채무 1,000만원 이하'만 심사가 가능하며, 채무확인서, 변제확인서, 판결문, 상환계획서 등의 증빙서류가 필요합니다.", "tag": "심사대상, 채무, 회생, 금융규제"}, {"major": "위촉 심사 및 제한", "minor": "재입사 규정", "q": "심사 대상이 되는 이적, 재입사, 수당환수 기준은 어떻게 되나요?", "a": "1. 직전 3년 이내 5개사 이상 이적자", "tag": "심사대상, 이적횟수, 재입사, 수당환수, 보증보험청구"}, {"major": "위촉 심사 및 제한", "minor": "재입사 규정", "q": "퇴사 후 6개월 이내 재입사 시 기준은 무엇인가요?", "a": "협회 말소 후 6개월 이내 재입사 시 전 소속으로 편입됩니다. (최상위관리자 동의 및 회사 승인 시 가능)", "tag": "재입사, 6개월미경과"}, {"major": "위촉 심사 및 제한", "minor": "재입사 규정", "q": "퇴사 후 6개월이 경과한 자의 재입사 기준은 무엇인가요?", "a": "전 소속의 계약 및 환수예상금이 남아있을 경우, 전건 소속이관으로 진행해야합니다.", "tag": "재입사, 6개월경과"}, {"major": "위촉 심사 및 제한", "minor": "재입사 규정", "q": "협회 말소 후 2년이 경과한 경우 재입사 조건은 무엇인가요?", "a": "협회 말소 후 2년 경과 시 환수금이 없다면 입사가 가능합니다.", "tag": "재입사, 2년경과"}, {"major": "위촉 심사 및 제한", "minor": "재입사 규정", "q": "재입사가 제한되는 케이스는 어떤 경우인가요?", "a": "1. 당사 등록 3회 이상자", "tag": "재입사제한, 재입사불가"}, {"major": "위촉 심사 및 제한", "minor": "심사 대상 및 기준", "q": "보험설계사 등록 제한 사유는 무엇입니까?", "a": "보험업법 제84조 제2항의 '등록제한사유'에 해당하거나 당사 인사 규정에 부합하지 않는 자는 등록이 제한됩니다.", "tag": "등록제한, 보험업법, 인사규정"}, {"major": "위촉 심사 및 제한", "minor": "심사 대상 및 기준", "q": "위촉 중 추가로 위촉 제한 사유가 확인될 경우 어떤 조치가 취해지나요?", "a": "위촉 이후라도 부실모집, 법규위반, 불완전판매 등의 위촉 제한 사유가 추가로 확인될 경우 강제해촉 될 수 있습니다.", "tag": "강제해촉, 사후검증, 위촉제한, 인사조치"}, {"major": "위촉 심사 및 제한", "minor": "심사 대상 및 기준", "q": "위촉 불가와 심사 대상의 근본적인 차이점은 무엇인가요?", "a": "'위촉 불가'는 심사 자체가 불가능한 결격 사유를 의미하며, '심사 대상'은 위촉제한자 심사 위원회를 통해 승인 여부를 판단받을 수 있는 대상을 의미합니다(전건 승인을 의미하지 않음).", "tag": "위촉불가, 심사대상, 승인여부, 심사위원회"}, {"major": "위촉 심사 및 제한", "minor": "위촉 결격 사유", "q": "강제해촉 처분을 받은 설계사의 재입사가 가능한가요?", "a": "보험업법 위반 등의 사유로 강제해촉 처분을 받은 이력이 있는 경우 재입사가 제한됩니다.", "tag": "강제해촉, 보험업법위반, 재입사제한, 징계이력"}, {"major": "위촉 심사 및 제한", "minor": "재입사 규정", "q": "환수금 상환 여부에 따른 재입사 금지 조건은 무엇인가요?", "a": "환수금이 남아있거나, 1년 이상 환수금을 상환하지 않은 이력이 있는 경우 재입사가 제한됩니다.", "tag": "환수금미상환, 재입사제한, 상환이력, 금융건전성"}, {"major": "위촉 심사 및 제한", "minor": "재입사 규정", "q": "당사 등록 횟수에 따른 재입사 제한 규정은 어떻게 되나요?", "a": "당사 등록 이력이 3회 이상인 자는 재입사가 제한됩니다.", "tag": "재입사제한, 등록횟수, 인사규정, 입사제한"}, {"major": "위촉 심사 및 제한", "minor": "재입사 규정", "q": "재입사 시 전 소속의 계약 및 환수금이 남아있는 경우의 처리 방식은?", "a": "말소 후 6개월이 경과했더라도 전 소속의 계약 및 환수예상금이 남아있다면 '전건 소속변경'으로 처리합니다. 단, 말소 후 2년이 경과하고 환수금이 전혀 없는 경우에는 일반 입사가 가능합니다.", "tag": "재입사, 환수예상금, 소속변경, 2년경과"}, {"major": "위촉 심사 및 제한", "minor": "재입사 규정", "q": "퇴사 후 당사에 재입사할 때 전 소속으로 편입되는 기준 기간은?", "a": "협회 말소 후 6개월이 경과되지 않은 상태에서 재입사할 경우 원칙적으로 전 소속으로 편입됩니다. 단, 최상위 관리자의 동의를 얻어 회사 승인을 받은 경우에는 재입사가 가능합니다.", "tag": "재입사, 말소기간, 소속편입, 관리자동의"}, {"major": "위촉 심사 및 제한", "minor": "위촉 결격 사유", "q": "경력증명서상 '금융사고자'로 등재된 경우의 처리는 어떻게 되나요?", "a": "전 소속 회사의 경력증명서상에 금융사고자(사고, 제재 이력 등)로 등재된 건이 있는 경우 위촉이 불가합니다.", "tag": "금융사고자, 경력증명서, 위촉불가, 제재내역"}, {"major": "위촉 심사 및 제한", "minor": "심사 대상 및 기준", "q": "불완전판매 이력이 위촉에 미치는 영향과 구체적 수치는 어떻게 되나요?", "a": "직전 3년 이내에 불완전판매 건수가 3건을 초과하는 경우 위촉 불가 대상에 해당합니다.", "tag": "불완전판매, 위촉제한, 3년이내, 건수기준"}, {"major": "위촉 심사 및 제한", "minor": "심사 대상 및 기준", "q": "부실모집 및 법규 위반 이력자의 위촉 제한 세부 기준은 무엇인가요?", "a": "고의 또는 과실로 인한 부실모집 사실이 등재된 자, 또는 직전 3년 이내에 1건 이상의 법규 위반 사실이 있는 자는 위촉 불가 대상입니다.", "tag": "부실모집, 법규위반, 위촉불가, 제재이력"}, {"major": "위촉 심사 및 제한", "minor": "심사 대상 및 기준", "q": "수당 환수금이 미상환 상태인 경우의 위촉 처리 기준은 무엇인가요?", "a": "수당 환수(100만 원 이상) 건에 대해 상환 중이거나 미상환 상태인 경우, 등급과 관계없이 위촉 불가 대상입니다.", "tag": "수당미상환, 위촉불가, 환수금, 결격사유"}, {"major": "위촉 심사 및 제한", "minor": "심사 대상 및 기준", "q": "보험사고와 관련된 사고수당 환수 이력자의 위촉 규정은 어떻게 되나요?", "a": "보증보험 사고건(보험수당 환수)이 있는 자는 위촉 불가 대상으로 분류됩니다.", "tag": "보험사고, 사고수당, 보증보험사고, 위촉불가"}, {"major": "위촉 심사 및 제한", "minor": "위촉 결격 사유", "q": "파산 선고를 받은 자의 위촉 가능 여부 및 예외 조건은 무엇인가요?", "a": "파산 이력자는 원칙적으로 위촉 불가 대상입니다. 단, 복권된 경우에는 심사 대상이 될 수 있으나 복권되지 아니한 자는 위촉이 엄격히 제한됩니다.", "tag": "파산자, 위촉불가, 복권여부, 결격사유"}, {"major": "위촉 심사 및 제한", "minor": "심사 대상 및 기준", "q": "수당 환수 이력이 있는 경우 위촉이 가능한 조건은 무엇인가요?", "a": "수당 환수가 100만 원 이상인 경우, 상환을 완료하고 신용등급이 1~6등급 이내라면 심사 대상으로서 위촉 가능성을 검토할 수 있습니다. 상환 완료 확인서 제출이 필수입니다.", "tag": "수당환수, 상환완료, 신용등급, 심사대상"}, {"major": "위촉 심사 및 제한", "minor": "심사 대상 및 기준", "q": "이적 횟수가 과다한 설계사의 위촉 제한 기준은 무엇인가요?", "a": "최근 3년 이내에 5개사를 초과하여 이적한 경력이 있는 경우 심사 대상에 해당합니다. 이는 e클린보험서비스 및 협회 조회를 통해 확인됩니다.", "tag": "이적횟수, 위촉제한, 심사대상, 경력조회"}, {"major": "위촉 심사 및 제한", "minor": "심사 대상 및 기준", "q": "신용회복 또는 개인회생 이력자의 위촉 심사 기준은 어떻게 되나요?", "a const ICONS = {
    '교육 및 연수': '📚', '위촉 심사 및 제한': '🔍',
    '위촉 및 등록': '📋', '시스템 및 전산': '💻'
};
const MINOR_ICONS = {
    '등록 및 보수 교육': '📖', '입문 교육': '🎓', '심사 대상 및 기준': '⚖️',

    '등록 절차': '📝', '시스템 사용': '🖥️'
};

// ===== 홈 =====
function showHome() {
    closeAll();
    const majors = [...new Set(KB.map(i => i.major))].filter(Boolean).sort();
    let html = '<div class="title-section"><div class="title-main">반갑습니다! 인사업무봇입니다 🤖</div><div class="title-sub">궁금한 주제를 선택하거나 직접 검색하세요</div></div>';
    majors.forEach(major => {
        const items = KB.filter(i => i.major === major);
        const minors = [...new Set(items.map(i => i.minor))].filter(Boolean);
        const icon = ICONS[major] || '📌';
        html += `<button class="card-btn" onclick="showMinors('${esc(major)}')">
            <div class="card-icon">${icon}</div>
            <div>
                <div class="card-title">${major}</div>
                <div class="card-desc">${minors.slice(0,3).join(' · ')}${minors.length > 3 ? ' 외 ' + (minors.length-3) + '개' : ''}</div>
            </div>
        </button>`;
    });
    document.getElementById('content').innerHTML = html;
    lucide.createIcons();
}

// ===== 소주제 =====
function showMinors(major) {
    closeAll();
    const items = KB.filter(i => i.major === major);
    const minors = [...new Set(items.map(i => i.minor))].filter(Boolean).sort();
    let html = `<div class="nav-bar">
        <button class="nav-btn" onclick="showHome()"><i data-lucide="home" style="width:14px;height:14px;"></i> 처음으로</button>
    </div>
    <div class="title-section"><div class="title-main">${major}</div><div class="title-sub">세부 항목을 선택하세요</div></div>`;
    minors.forEach(minor => {
        const cnt = items.filter(i => i.minor === minor).length;
        const icon = MINOR_ICONS[minor] || '📄';
        html += `<button class="card-btn" onclick="showQuestions('${esc(major)}','${esc(minor)}')">
            <div class="card-icon">${icon}</div>
            <div>
                <div class="card-title">${minor}</div>
                <div class="card-desc">${cnt}개 규정</div>
            </div>
        </button>`;
    });
    document.getElementById('content').innerHTML = html;
    lucide.createIcons();
}

    let html = `<div class="nav-bar">
        <button class="nav-btn" onclick="showHome()"><i data-lucide="home" style="width:14px;height:14px;"></i> 처음으로</button>
        <button class="nav-btn" onclick="showMinors('${esc(major)}')"><i data-lucide="chevron-left" style="width:14px;height:14px;"></i> ${major}</button>
    </div>
    <div class="title-section"><div class="title-main">${minor}</div><div class="title-sub">${items.length}개 규정</div></div>`;
    items.forEach((item, idx) => {
        const globalIdx = KB.indexOf(item);
        html += `<button class="card-btn" onclick="showAnswer(${globalIdx})">
            <div class="card-icon">❓</div>
            <div>
                <div class="card-title">${item.q}</div>
                <div class="card-desc">${item.tag}</div>
            </div>
        </button>`;
    });
    document.getElementById('content').innerHTML = html;
    lucide.createIcons();
}

// ===== 답변 =====
function showAnswer(idx) {
    closeAll();
    const item = KB[idx];
    if (!item) return;
    const isBm = bookmarks.some(b => b.q === item.q);
    document.getElementById('content').innerHTML = `
        <div class="nav-bar">
            <button class="nav-btn" onclick="showHome()"><i data-lucide="home" style="width:14px;height:14px;"></i> 처음으로</button>
            <button class="nav-btn" onclick="showMinors('${esc(item.major)}')"><i data-lucide="chevron-left" style="width:14px;height:14px;"></i> ${item.major}</button>
            <button class="nav-btn" onclick="showQuestions('${esc(item.major)}','${esc(item.minor)}')"><i data-lucide="chevron-left" style="width:14px;height:14px;"></i> ${item.minor}</button>
        </div>
        <div class="answer-card">
            <div class="answer-tag">${item.major} > ${item.minor}</div>
            <div class="answer-q">❓ ${item.q}</div>
            <div class="answer-a">${item.a}</div>
            <div class="answer-actions">
                <button class="act-btn" onclick="copyAnswer(${idx})"><i data-lucide="copy" style="width:12px;height:12px;"></i> 복사</button>
                <button class="act-btn ${isBm ? 'saved' : ''}" id="bm-btn-${idx}" onclick="toggleBmItem(${idx})">
                    <i data-lucide="star" style="width:12px;height:12px;"></i> ${isBm ? '저장됨' : '저장'}
                </button>
            </div>
        </div>`;
    lucide.createIcons();
}

// ===== 검색 =====
function doSearch() {
    const q = document.getElementById('user-input').value.trim();
    if (!q) return;
    closeAll();
    const ql = q.toLowerCase();
    const results = KB.filter(item =>
        item.q.toLowerCase().includes(ql) ||
        item.a.toLowerCase().includes(ql) ||
        item.tag.toLowerCase().includes(ql) ||
        item.major.toLowerCase().includes(ql) ||
        item.minor.toLowerCase().includes(ql)
    ).slice(0, 15);

    let html = `<div class="nav-bar">
        <button class="nav-btn" onclick="showHome()"><i data-lucide="home" style="width:14px;height:14px;"></i> 처음으로</button>
    </div>
    <div class="title-section">
        <div class="title-main">🔍 검색 결과</div>
        <div class="title-sub">"${q}" — ${results.length}건</div>
    </div>`;

    if (results.length === 0) {
        html += '<div class="empty"><p>검색 결과가 없습니다</p><p>다른 키워드로 검색해보세요</p></div>';
    } else {
        results.forEach(item => {
            const globalIdx = KB.indexOf(item);
            html += `<button class="card-btn" onclick="showAnswer(${globalIdx})">
                <div class="card-icon">🔍</div>
                <div>
                    <div class="card-title">${item.q}</div>
                    <div class="card-desc">${item.major} > ${item.minor}</div>
                </div>
            </button>`;
        });
    }
    document.getElementById('content').innerHTML = html;
    document.getElementById('user-input').value = '';
    lucide.createIcons();
}

// ===== 즐겨찾기 =====
function toggleBmItem(idx) {
    const item = KB[idx];
    const existing = bookmarks.findIndex(b => b.q === item.q);
    if (existing > -1) {
        bookmarks.splice(existing, 1);
        toast('즐겨찾기에서 제거됐습니다.');
    } else {
        bookmarks.push({ q: item.q, a: item.a, major: item.major, minor: item.minor, tag: item.tag, date: new Date().toLocaleDateString() });
        toast('⭐ 즐겨찾기에 추가됐습니다!');
    }
    localStorage.setItem('wb_bm', JSON.stringify(bookmarks));
    showAnswer(idx); // 버튼 상태 갱신
}

function toggleBm() {
    const panel = document.getElementById('bm-panel');
    const isShow = panel.classList.contains('show');
    closeAll();
    if (!isShow) {
        renderBm();
        panel.classList.add('show');
    }
    lucide.createIcons();
}

function renderBm() {
    const el = document.getElementById('bm-list');
    if (!bookmarks.length) {
        el.innerHTML = '<div class="empty"><p>저장된 즐겨찾기가 없습니다</p></div>';
        return;
    }
    el.innerHTML = bookmarks.map((b, i) => `
        <div class="bm-card" onclick="showBmAnswer(${i})">
            <div class="bm-card-tag">${b.major} > ${b.minor}</div>
            <div class="bm-card-q">${b.q}</div>
            <div class="bm-card-actions">
                <button class="act-btn" onclick="event.stopPropagation(); removeBm(${i})">
                    <i data-lucide="trash-2" style="width:12px;height:12px;"></i> 삭제
                </button>
            </div>
        </div>`).join('');
    lucide.createIcons();
}

function showBmAnswer(i) {
    const b = bookmarks[i];
    const idx = KB.findIndex(k => k.q === b.q);
    if (idx > -1) { closeAll(); showAnswer(idx); }
}

function removeBm(i) {
    bookmarks.splice(i, 1);
    localStorage.setItem('wb_bm', JSON.stringify(bookmarks));
    renderBm();
    toast('삭제됐습니다.');
}

// ===== 백업 =====
function toggleBackup(e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById('backup-menu');
    menu.classList.toggle('show');
}

function downloadExcel() {
    if (!bookmarks.length) { toast('저장된 즐겨찾기가 없습니다.'); return; }
    const data = bookmarks.map((b, i) => ({ '번호': i+1, '질문': b.q, '답변': b.a, '카테고리': b.major, '날짜': b.date }));
    const ws = XLSX.utils.json_to_sheet(data);
    ws['!cols'] = [{wch:6},{wch:40},{wch:50},{wch:15},{wch:12}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '즐겨찾기');
    XLSX.writeFile(wb, `인사봇_즐겨찾기_${new Date().toISOString().split('T')[0]}.xlsx`);
    toast('📊 Excel 다운로드 완료!');
    document.getElementById('backup-menu').classList.remove('show');
}

function copyAll() {
    if (!bookmarks.length) { toast('저장된 즐겨찾기가 없습니다.'); return; }
    const text = bookmarks.map((b, i) => `${i+1}. ${b.q}\n${b.a}`).join('\n\n---\n\n');
    navigator.clipboard.writeText(text).then(() => {
        toast('📋 클립보드에 복사됐습니다!');
        document.getElementById('backup-menu').classList.remove('show');
    });
}

function copyAnswer(idx) {
    const item = KB[idx];
    navigator.clipboard.writeText(`❓ ${item.q}\n\n${item.a}`).then(() => toast('📋 복사됐습니다!'));
}

// ===== 테마 =====
function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('wb_theme', next);
    document.getElementById('theme-icon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
    lucide.createIcons();
}

// ===== 유틸 =====
function closeAll() {
    document.getElementById('bm-panel').classList.remove('show');
    document.getElementById('backup-menu').classList.remove('show');
}

function esc(str) { return str.replace(/'/g, "\\'"); }

function toast(msg) {
    const el = document.getElementById('toast');
    el.innerText = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
}

// ===== 클릭 외부 =====
document.addEventListener('click', (e) => {
    if (!e.target.closest('#backup-menu') && !e.target.closest('.icon-btn[onclick*="toggleBackup"]')) {
        document.getElementById('backup-menu').classList.remove('show');
    }
});

// ===== 시작 =====
const savedTheme = localStorage.getItem('wb_theme') || 'light';
if (savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    setTimeout(() => {
        const icon = document.getElementById('theme-icon');
        if (icon) { icon.setAttribute('data-lucide', 'sun'); lucide.createIcons(); }
    }, 100);
}
showHome();
lucide.createIcons();
</script>
</body>
</html>
